[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rungrid"
version = "0.1.0.dev0"
description = "Durable distributed experiment scheduling worker and SDK"
requires-python = ">=3.11"
dependencies = ["grpcio==1.72.1", "protobuf==6.33.6", "boto3==1.38.23"]

[project.optional-dependencies]
dev = ["grpcio-tools==1.72.1", "pytest==8.3.5", "pytest-cov==6.1.1", "matplotlib==3.10.3"]

[project.scripts]
rungrid-worker = "rungrid_worker.main:main"

[tool.setuptools]
package-dir = {rungrid = "sdk/python/rungrid", rungrid_worker = "worker/python/rungrid_worker"}
packages = ["rungrid", "rungrid_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires running PostgreSQL, server, workers and MinIO"]
